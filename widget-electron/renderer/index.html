<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Local Agent Society Widget</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget" class="widget">
    <div class="topbar">
      <div id="name" class="name">Agent</div>
      <button id="door" class="facebtn door-corner" title="Deactivate (close widget, mark inactive)">&#128682;</button>
    </div>
    <div id="log" class="log"></div>

    <div class="buttonbar">
      <div class="bar-left">
        <button id="gear" class="facebtn" title="Settings">&#9881;</button>
        <button id="clear" class="facebtn" title="Send /clear to the linked terminal(s)">&#129529;</button>
      </div>
      <div class="bar-right">
        <button id="open" class="facebtn" title="Open: terminal window / folder at this agent's path (click = default, hold or right-click = choose and reorder)">&#10697;</button>
        <button id="speaker" class="facebtn" title="Mute/unmute">&#128266;</button>
        <button id="mic" class="facebtn" title="Dictate (click to start/stop, double-click to test mic)">&#127908;</button>
        <button id="children" class="facebtn" title="Children: which connected session (Claude, Codex, shell) hears the mic — click or hold to choose">&#128101;</button>
      </div>
    </div>

    <!-- Inline, NOT a full-screen overlay — settings mode keeps the real
         name/log visible above it. See widget.js's setSettingsOpen. -->
    <div id="settings" class="settings settings-inline hidden">
      <div class="settings-row">
        <label for="color">Color</label>
        <input id="color" type="color" />
      </div>
      <div class="settings-row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="0.2" max="1" step="0.02" />
      </div>
      <div class="settings-row">
        <label for="alwaysOnTop">Always on top</label>
        <input id="alwaysOnTop" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="mute">Mute</label>
        <input id="mute" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="expandWhenHidden">Expand when hidden</label>
        <input id="expandWhenHidden" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="speechBubbles" title="What this agent says also pops up at the screen edge when its widget is on another Space">Speech bubbles</label>
        <input id="speechBubbles" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="wakeEnabled">Wake up via vortexia</label>
        <input id="wakeEnabled" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="micTarget">Dictation goes to</label>
        <select id="micTarget">
          <option value="default">Last used session</option>
          <option value="all">All sessions</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="ccDefault">Copy last-used session</label>
        <input id="ccDefault" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="micLanguage">Dictation language</label>
        <select id="micLanguage">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
          <option value="auto">Auto-detect</option>
        </select>
      </div>
      <!-- Shared by every widget (main.js tile reconciler), not per agent. -->
      <div class="settings-row settings-group">All widgets</div>
      <div class="settings-row">
        <label for="tileShrinkMs" title="How long a widget stays big after its Space is back on screen">Shrink delay (ms)</label>
        <input id="tileShrinkMs" type="number" min="0" max="30000" step="100" />
      </div>
      <div class="settings-row">
        <label for="tileTickMs" title="How often every widget checks which Space it is on">Heartbeat (ms)</label>
        <input id="tileTickMs" type="number" min="100" max="10000" step="100" />
      </div>
    </div>

    <!-- Drawers: settings above, the Open menu and the children menu below —
         one inline panel at a time in normal flow under the button bar; the
         window grows down to fit it (widget.js's openDrawer/fitWindowToDrawer).
         "Open" menu: both actions in order, the top one is what a plain
         click runs. -->
    <div id="openMenu" class="open-menu hidden"></div>
    <!-- Children menu: which connected session (this agent's children) the
         mic talks to — the agent's own sessions.target in .las-agent.json. -->
    <div id="childrenMenu" class="open-menu hidden"></div>

    <div id="resizeHandle" class="resize-handle" title="Drag to resize"></div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
